# Include this file inside the `http { ... }` block in C:\nginx\conf\nginx.conf.
#
# Update the TLS certificate paths and the proxy_pass target before deployment.
# The frontend calls /api/*; this location removes /api before forwarding to the backend.

server {
    listen 80;
    server_name pdmadminconsoled.kla.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name pdmadminconsoled.kla.com;

    ssl_certificate     C:/nginx/certs/pdmadminconsoled.kla.com.crt;
    ssl_certificate_key C:/nginx/certs/pdmadminconsoled.kla.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root C:/nginx/html/pdm-admin-console;
    index index.html;
    client_max_body_size 15m;

    location /api/ {
        # Change 127.0.0.1:8080 if the Admin Console backend is hosted elsewhere.
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
